[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"
authors = ["{{authors}}"]
license = "MIT"

{%- if starter == "wifi" and chip == "ws63" %}
[workspace]
members = [".", "tools/rf-resource-report"]
default-members = ["."]
resolver = "2"

[workspace.dependencies]
hisi-rf = { version = "=0.1.0-alpha.49", features = ["chip-ws63", "profile-wifi-wpa2-smoltcp"] }
{%- endif %}

[[bin]]
name = "{{crate_name}}"
path = "src/main.rs"

[dependencies]
{%- if chip == "ws63" %}
# 0.5.0+ has NO default chip (esp-hal style) — every consumer names one, so
# chip-ws63 is required here (a missing chip is a clear compile_error).
hisi-hal = { version = "0.7.0-alpha.3", features = ["chip-ws63"{% if starter == "async" %}, "embassy", "unstable"{% elsif starter == "wifi" %}, "unstable"{% endif %}] }
# `boot-header` bakes the 0x300 boot header into the ELF at link time. `just flash`
# still uses `hisi-fwpkg plan --image-output` so probe-rs writes a complete bin
# image; `patch-hash` is reserved for ELF-based `probe-rs run`/embedded-test paths.
hisi-riscv-rt = { version = "0.5.7", features = ["chip-ws63", "boot-header"{% if starter == "wifi" %}, "ws63-bgle-32k", "ws63-radio-main-stack-32k"{% endif %}] }
ws63-pac = "0.4.0"
{%- else %}
# chip-bs21 covers the whole BS2X family (BS21/BS22/BS20); the chip differs only
# in L2RAM size, set in memory.x.
hisi-hal = { version = "0.7.0-alpha.3", default-features = false, features = ["chip-bs21", "rt", "unstable"{% if starter == "async" %}, "embassy"{% endif %}] }
hisi-riscv-rt = { version = "0.5.7", default-features = false, features = ["chip-bs21", "unstable"] }
bs2x-pac = "0.1.2"
{%- endif %}
riscv = "0.13"
{%- if starter == "blinky" %}
embedded-hal = "1.0.0"
{%- endif %}
{%- if starter == "async" %}
embassy-executor = { version = "0.10", features = ["platform-riscv32", "executor-thread"] }
embassy-time = { version = "0.5", features = ["tick-hz-1_000_000"] }
static_cell = "2"
{%- endif %}
{%- if starter == "wifi" and chip == "ws63" %}
hisi-panic-handler = { version = "0.1.0", default-features = false, features = ["panic-uart0"] }
hisi-rf = { workspace = true }
hisi-rtos = "0.1.0-alpha.14"
smoltcp = { version = "0.13", default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-dhcpv4"] }
{%- endif %}

[profile.release]
opt-level = "s"
lto = true
debug = true
codegen-units = 1

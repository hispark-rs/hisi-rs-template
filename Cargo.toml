[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"
authors = ["{{authors}}"]
license = "MIT"

[[bin]]
name = "{{crate_name}}"
path = "src/main.rs"

[dependencies]
{%- if chip == "ws63" %}
# 0.5.0+ has NO default chip (esp-hal style) — every consumer names one, so
# chip-ws63 is required here (a missing chip is a clear compile_error).
hisi-hal = { version = "0.7.0-alpha.2", features = ["chip-ws63"{% if starter == "async" %}, "embassy", "unstable"{% endif %}] }
# `boot-header` bakes the 0x300 boot header into the ELF at link time. `just flash`
# still uses `hisi-fwpkg plan --image-output` so probe-rs writes a complete bin
# image; `patch-hash` is reserved for ELF-based `probe-rs run`/embedded-test paths.
hisi-riscv-rt = { version = "0.5.4", features = ["chip-ws63", "boot-header"] }
ws63-pac = "0.3.0"
{%- else %}
# chip-bs21 covers the whole BS2X family (BS21/BS22/BS20); the chip differs only
# in L2RAM size, set in memory.x.
hisi-hal = { version = "0.7.0-alpha.2", default-features = false, features = ["chip-bs21", "rt", "unstable"{% if starter == "async" %}, "embassy"{% endif %}] }
hisi-riscv-rt = { version = "0.5.4", default-features = false, features = ["chip-bs21", "unstable"] }
bs2x-pac = "0.1.2"
{%- endif %}
riscv = "0.13"
{%- if starter == "blinky" %}
embedded-hal = "1.0.0"
{%- endif %}
{%- if starter == "async" %}
embassy-executor = { version = "0.10", features = ["platform-riscv32", "executor-thread"] }
embassy-time = { version = "0.5", features = ["tick-hz-1_000_000"] }
static_cell = "2"
{%- endif %}

[profile.release]
opt-level = "s"
lto = true
debug = true

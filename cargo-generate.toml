[template]
cargo_generate_version = ">=0.18.0"
description = "HiSilicon WS63 / BS2X bare-metal Rust app (hisi-riscv-rs ecosystem)"

# The BS2X family is one chip in the HAL (`chip-bs21`); the SKUs differ only in
# L2RAM size (bs20 = 128K, the rest 160K, set in memory.x) and the QEMU machine
# name. bs21 == bs21e (the SDK SKU it maps to); bs22 is byte-identical to bs21.
[placeholders.chip]
type = "string"
prompt = "Target chip"
choices = ["ws63", "bs21", "bs21e", "bs22", "bs20"]
default = "ws63"

[placeholders.starter]
type = "string"
prompt = "Starter app"
choices = ["blinky", "uart_hello", "async", "wifi", "radio"]
default = "blinky"

[conditional.'starter == "radio"'.placeholders.radio_profile]
type = "string"
prompt = "Radio profile"
choices = [
    "ble-peripheral",
    "ble-central",
    "ble-dual-role",
    "sle-announce",
    "sle-seek",
    "sle-ssap",
]
default = "ble-peripheral"

# Optional flash address override for the `app` partition that flashboot loads.
# `hisi-fwpkg plan` knows the per-chip default and emits `base_addr`; the
# generated justfile passes this value only so custom partition tables can be
# captured at project generation time.
# Defined per-chip via mutually-exclusive conditionals (so the default is correct
# even in `--silent` generation):
#   WS63  = 0x00230000  (hardware-validated 2026-06-14)
#   BS2X  = 0x00090000  (hisi-fwpkg's `Chip::Bs21` default — NOT yet HIL-validated;
#                        confirm against your fbb_bs2x partition table before trusting it)
[conditional.'chip == "ws63"']
# WS63 gets its memory layout from hisi-riscv-rt's bundled linker scripts, so a
# project-level memory.x is only needed for the BS2X family.
ignore = ["memory.x"]

[conditional.'starter != "wifi"']
ignore = ["src/wifi.rs", "src/wifi_config.rs"]

[conditional.'starter != "radio"']
ignore = ["src/radio.rs"]

[conditional.'starter != "wifi" && starter != "radio"']
ignore = ["tools/rf-resource-report"]

[conditional.'chip == "ws63"'.placeholders.app_partition_addr]
type = "string"
prompt = "App partition flash address (leave default unless you have a custom partition table)"
default = "0x00230000"

[conditional.'chip != "ws63"'.placeholders.app_partition_addr]
type = "string"
prompt = "App partition flash address (BS2X default; verify against your fbb_bs2x partition table)"
default = "0x00090000"

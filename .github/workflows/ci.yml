name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Compile-time fixtures only. Real network credentials never enter CI or the
  # template repository; users inject them for their own final firmware image.
  WS63_WIFI_SSID: ci-network
  WS63_WIFI_PASSPHRASE: ci-passphrase

jobs:
  generate:
    name: Generate ${{ matrix.chip }} / ${{ matrix.starter }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: ws63
            starter: blinky
            project: hp-ws63-blinky
            crate: hp_ws63_blinky
            app_addr: "0x00230000"
            image: true
          - chip: ws63
            starter: uart_hello
            project: hp-ws63-uart-hello
            crate: hp_ws63_uart_hello
            app_addr: "0x00230000"
            image: true
          - chip: ws63
            starter: wifi
            project: hp-ws63-wifi
            crate: hp_ws63_wifi
            app_addr: "0x00230000"
            image: true
          - chip: ws63
            starter: radio
            radio_profile: ble-peripheral
            project: hp-ws63-ble-peripheral
            crate: hp_ws63_ble_peripheral
            app_addr: "0x00230000"
            image: true
          - chip: ws63
            starter: radio
            radio_profile: ble-central
            project: hp-ws63-ble-central
            crate: hp_ws63_ble_central
            app_addr: "0x00230000"
            image: false
          - chip: ws63
            starter: radio
            radio_profile: ble-dual-role
            project: hp-ws63-ble-dual-role
            crate: hp_ws63_ble_dual_role
            app_addr: "0x00230000"
            image: false
          - chip: ws63
            starter: radio
            radio_profile: sle-announce
            project: hp-ws63-sle-announce
            crate: hp_ws63_sle_announce
            app_addr: "0x00230000"
            image: true
          - chip: ws63
            starter: radio
            radio_profile: sle-seek
            project: hp-ws63-sle-seek
            crate: hp_ws63_sle_seek
            app_addr: "0x00230000"
            image: false
          - chip: ws63
            starter: radio
            radio_profile: sle-ssap
            project: hp-ws63-sle-ssap
            crate: hp_ws63_sle_ssap
            app_addr: "0x00230000"
            image: false
          - chip: bs21
            starter: blinky
            project: hp-bs21-blinky
            crate: hp_bs21_blinky
            app_addr: "0x00090000"
            image: false

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: bash .github/scripts/install-toolchain.sh

      - uses: dtolnay/rust-toolchain@stable

      - name: Install template tools
        run: |
          cargo +stable install cargo-generate just
          cargo +stable install hisi-fwpkg-cli --version 0.3.2

      - name: Generate project
        shell: bash
        run: |
          args=(
            --path . --name "${{ matrix.project }}"
            --define chip=${{ matrix.chip }}
            --define starter=${{ matrix.starter }}
            --define app_partition_addr=${{ matrix.app_addr }}
            --vcs none --no-workspace --destination "$RUNNER_TEMP" --silent
          )
          if [ "${{ matrix.starter }}" = radio ]; then
            args+=(--define radio_profile=${{ matrix.radio_profile }})
          fi
          cargo generate "${args[@]}"

      - name: Check generated project
        working-directory: ${{ runner.temp }}/${{ matrix.project }}
        run: cargo check -Zbuild-std=core,alloc

      - name: Check Wi-Fi failure contract
        if: matrix.starter == 'wifi'
        working-directory: ${{ runner.temp }}/${{ matrix.project }}
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'hisi-rf-application-config/v1' src/wifi.rs
          grep -q 'hisi-rtos-start/v1' src/wifi.rs
          grep -q 'hisi_rtos::ws63::start' src/wifi.rs
          grep -q 'hisi_rtos::bind_interrupts!' src/wifi.rs
          grep -q 'hisi_rtos::SchedulerStorage' src/wifi.rs
          grep -q 'hisi_rtos::SchedulerArena' src/wifi.rs
          grep -q 'controller.split(RUNNER_BUDGET)' src/wifi.rs
          grep -q 'runner.wait_ready().await' src/wifi.rs
          grep -q 'runner.run_once(ready)' src/wifi.rs
          if grep -q 'start_runner' src/wifi.rs; then
            echo "generated Wi-Fi starter still uses the removed blocking runner facade" >&2
            exit 1
          fi
          if grep -q 'SchedulerStackArena' src/wifi.rs; then
            echo "generated Wi-Fi starter still uses the deprecated stack-only arena name" >&2
            exit 1
          fi
          if grep -Eq \
            'panic!\("Wi-Fi operation failed"|expect\("install caller-owned radio storage"|expect\("start hisi-rtos"' \
            src/wifi.rs; then
            echo "recoverable Wi-Fi failures must use structured diagnostics" >&2
            exit 1
          fi
          if grep -Eq \
            'hisi_rtos::start_with_port|hisi_rtos::SchedulerPort|hisi_rtos::ws63::Allocator|rtos_(allocate|deallocate)|extern "C" fn (TIMER_INT0|SOFT_INT0)' \
            src/wifi.rs; then
            echo "generated Wi-Fi projects must use caller-owned storage and the native WS63 RTOS facade" >&2
            exit 1
          fi

      - name: Check radio composition contract
        if: matrix.starter == 'radio'
        working-directory: ${{ runner.temp }}/${{ matrix.project }}
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'hisi_rf::declare_radio_storage!' src/radio.rs
          grep -q 'RADIO_STORAGE.report()' src/radio.rs
          grep -q 'hisi_rf::ws63::init(resources, storage)' src/radio.rs
          grep -q 'controller.split()' src/radio.rs
          grep -q 'parts.runner.run_once()' src/radio.rs
          grep -q 'profile-${{ matrix.radio_profile }}' Cargo.toml
          if grep -Eq 'hisi-rf-ws63|ws63-radio-sys|hisi-rf-rtos-driver' Cargo.toml; then
            echo "generated radio project leaked an internal composition dependency" >&2
            exit 1
          fi

      - name: Build generated project
        working-directory: ${{ runner.temp }}/${{ matrix.project }}
        run: cargo build -Zbuild-std=core,alloc --release

      - name: Check just recipes
        working-directory: ${{ runner.temp }}/${{ matrix.project }}
        run: just --list

      - name: Emit radio resource report
        if: matrix.starter == 'radio'
        working-directory: ${{ runner.temp }}/${{ matrix.project }}
        shell: bash
        run: |
          just resource-report
          test -s ${{ matrix.crate }}.resource.json
          grep -q '"schema":"hisi-rf-radio-resource-report/v1"' ${{ matrix.crate }}.resource.json
          grep -q '"profile":"${{ matrix.radio_profile }}"' ${{ matrix.crate }}.resource.json
          grep -q '"dynamic_task_slots":4' ${{ matrix.crate }}.resource.json
          grep -q '"task_stack_bytes":10240' ${{ matrix.crate }}.resource.json

      - name: Build plan image
        if: matrix.image
        working-directory: ${{ runner.temp }}/${{ matrix.project }}
        run: |
          just image
          test -s ${{ matrix.crate }}.img
          test -s ${{ matrix.crate }}.plan.json
          if [ "${{ matrix.starter }}" = "wifi" ]; then
            test -s ${{ matrix.crate }}.resource.json
            grep -q '"schema":"hisi-rf-resource-report/v10"' ${{ matrix.crate }}.resource.json
            grep -q '"profile":"wifi-wpa2-smoltcp"' ${{ matrix.crate }}.resource.json
            grep -q '"profile_revision":"ws63-wifi-2026-08-03-r9"' ${{ matrix.crate }}.resource.json
            grep -q '"runtime_resources_calibrated":false' ${{ matrix.crate }}.resource.json
            grep -q '"event_capacity":8' ${{ matrix.crate }}.resource.json
            grep -q '"control_storage_bytes":8800' ${{ matrix.crate }}.resource.json
            grep -q '"radio_state_bytes":2288' ${{ matrix.crate }}.resource.json
            grep -q '"dynamic_tasks_required":8' ${{ matrix.crate }}.resource.json
            grep -q '"vendor_task_slots":7' ${{ matrix.crate }}.resource.json
            grep -q '"worker_task_slots":1' ${{ matrix.crate }}.resource.json
            grep -q '"task_stack_bytes":180224' ${{ matrix.crate }}.resource.json
            grep -q '"minimum_task_stack_bytes":8192' ${{ matrix.crate }}.resource.json
            grep -q '"runtime_object_headroom_bytes":16384' ${{ matrix.crate }}.resource.json
            grep -q '"runtime_arena_bytes":197120' ${{ matrix.crate }}.resource.json
            grep -q '"arena_storage_bytes":101888' ${{ matrix.crate }}.resource.json
            grep -q '"shared_rf_arena_bytes":101824' ${{ matrix.crate }}.resource.json
            grep -q '"caller_owned_bytes":307808' ${{ matrix.crate }}.resource.json
          elif [ "${{ matrix.starter }}" = "radio" ]; then
            grep -q '"schema":"hisi-rf-radio-resource-report/v1"' ${{ matrix.crate }}.resource.json
            grep -q '"profile":"${{ matrix.radio_profile }}"' ${{ matrix.crate }}.resource.json
          fi

  resource-report:
    name: Radio resource report / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-09
          components: rust-src,llvm-tools-preview

      - name: Install template tools
        run: cargo +stable install cargo-generate just

      - name: Generate Wi-Fi project
        run: cargo +stable generate --path . --name hp-ws63-wifi --define chip=ws63 --define starter=wifi --define app_partition_addr=0x00230000 --vcs none --no-workspace --destination "${{ runner.temp }}" --silent

      - name: Emit profile resource report
        working-directory: ${{ runner.temp }}/hp-ws63-wifi
        run: just resource-report

      - name: Generate BLE peripheral project
        run: cargo +stable generate --path . --name hp-ws63-ble-peripheral --define chip=ws63 --define starter=radio --define radio_profile=ble-peripheral --define app_partition_addr=0x00230000 --vcs none --no-workspace --destination "${{ runner.temp }}" --silent

      - name: Emit BLE profile resource report
        working-directory: ${{ runner.temp }}/hp-ws63-ble-peripheral
        run: just resource-report

      - name: Generate SLE announce project
        run: cargo +stable generate --path . --name hp-ws63-sle-announce --define chip=ws63 --define starter=radio --define radio_profile=sle-announce --define app_partition_addr=0x00230000 --vcs none --no-workspace --destination "${{ runner.temp }}" --silent

      - name: Emit SLE profile resource report
        working-directory: ${{ runner.temp }}/hp-ws63-sle-announce
        run: just resource-report

  release:
    name: Publish template release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [generate, resource-report]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          grep -Eq "^## \\[$version\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          grep -Fq "| \`$GITHUB_REF_NAME\` |" docs/lifecycle.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
            exit 0
          fi

          release_kind=(--latest)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_kind=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "hisi-rs-template $GITHUB_REF_NAME" \
            --generate-notes \
            "${release_kind[@]}"

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Compile-time fixtures only. Real network credentials never enter CI or the
  # template repository; users inject them for their own final firmware image.
  WS63_WIFI_SSID: ci-network
  WS63_WIFI_PASSPHRASE: ci-passphrase

jobs:
  generate:
    name: Generate ${{ matrix.chip }} / ${{ matrix.starter }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: ws63
            starter: blinky
            project: hp-ws63-blinky
            crate: hp_ws63_blinky
            app_addr: "0x00230000"
            image: true
          - chip: ws63
            starter: uart_hello
            project: hp-ws63-uart-hello
            crate: hp_ws63_uart_hello
            app_addr: "0x00230000"
            image: true
          - chip: ws63
            starter: wifi
            project: hp-ws63-wifi
            crate: hp_ws63_wifi
            app_addr: "0x00230000"
            image: true
          - chip: bs21
            starter: blinky
            project: hp-bs21-blinky
            crate: hp_bs21_blinky
            app_addr: "0x00090000"
            image: false

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: bash .github/scripts/install-toolchain.sh

      - uses: dtolnay/rust-toolchain@stable

      - name: Install template tools
        run: |
          cargo +stable install cargo-generate just
          cargo +stable install hisi-fwpkg-cli --version 0.3.2

      - name: Generate project
        run: |
          cargo generate --path . --name ${{ matrix.project }} \
            --define chip=${{ matrix.chip }} \
            --define starter=${{ matrix.starter }} \
            --define app_partition_addr=${{ matrix.app_addr }} \
            --vcs none \
            --no-workspace \
            --destination "$RUNNER_TEMP" \
            --silent

      - name: Check generated project
        working-directory: ${{ runner.temp }}/${{ matrix.project }}
        run: cargo check -Zbuild-std=core,alloc

      - name: Build generated project
        working-directory: ${{ runner.temp }}/${{ matrix.project }}
        run: cargo build -Zbuild-std=core,alloc --release

      - name: Check just recipes
        working-directory: ${{ runner.temp }}/${{ matrix.project }}
        run: just --list

      - name: Build plan image
        if: matrix.image
        working-directory: ${{ runner.temp }}/${{ matrix.project }}
        run: |
          just image
          test -s ${{ matrix.crate }}.img
          test -s ${{ matrix.crate }}.plan.json

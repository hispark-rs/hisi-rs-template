# This project builds with the custom `hisi-riscv` toolchain: a stable rustc (1.96.0) with
# the target `riscv32imfc-unknown-none-elf` (hardware single-float ilp32f, no atomics)
# baked in as a BUILTIN — so we build without `-Z build-std`.
#
# It is NOT a distributable rustup channel; install + link it first:
#   curl -LO https://github.com/hispark-rs/hisi-riscv-rust-toolchain/releases/download/v1.96.0-2/hisi-riscv-rust-1.96.0-x86_64-unknown-linux-gnu.tar.gz
#   tar xzf hisi-riscv-rust-1.96.0-x86_64-unknown-linux-gnu.tar.gz
#   rustup toolchain link hisi-riscv "$PWD/stage2"
#
# Build recipe + sources: https://github.com/hispark-rs/hisi-riscv-rust-toolchain
[toolchain]
channel = "hisi-riscv"

# Generated projects use the official upstream nightly that contains the
# `riscv32imfc-unknown-none-elf` builtin target. rustup does not ship a prebuilt
# rust-std component for this target yet, so the just recipes pass
# `-Zbuild-std=core,alloc` and require rust-src.
[toolchain]
channel = "nightly-2026-07-09"
profile = "minimal"
components = ["rust-src", "clippy", "rustfmt", "llvm-tools-preview"]

# This project builds with the custom `hisi-riscv` toolchain: a stable rustc (1.96.0) with
# the target `riscv32imfc-unknown-none-elf` (hardware single-float ilp32f, no atomics)
# baked in as a BUILTIN — so we build without `-Z build-std`.
#
# It is NOT a distributable rustup channel; install + link it first. Release
# v1.96.0-2 ships four hosts — pick the triple matching yours (linux x86_64/aarch64,
# aarch64-apple-darwin, x86_64-pc-windows-msvc):
#   HOST=x86_64-unknown-linux-gnu
#   curl -LO https://github.com/hispark-rs/hisi-riscv-rust-toolchain/releases/download/v1.96.0-2/hisi-riscv-rust-1.96.0-$HOST.tar.gz
#   tar xzf hisi-riscv-rust-1.96.0-$HOST.tar.gz
#   rustup toolchain link hisi-riscv "$PWD/stage2"
#
# Build recipe + sources: https://github.com/hispark-rs/hisi-riscv-rust-toolchain
[toolchain]
channel = "hisi-riscv"
